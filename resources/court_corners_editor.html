<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reco - Court Corners Editor</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a1a; color: #ddd; font-family: system-ui, sans-serif; }
.header { padding: 12px 20px; background: #222; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.header h1 { font-size: 16px; font-weight: 600; }
.header button { padding: 6px 12px; border-radius: 4px; border: 1px solid #444; background: #333; color: #ddd; font-size: 13px; cursor: pointer; }
.header button.primary { background: #4a7a4a; border-color: #5a9a5a; }
.header button:hover { background: #444; }
.header button.primary:hover { background: #5a8a5a; }
.header button:disabled { opacity: 0.4; cursor: default; }
.header .spacer { flex: 1; }
.header .info { color: #888; font-size: 12px; }
.target { padding: 10px 20px; background: #2a3a4a; font-size: 15px; font-weight: 600; color: #9cf; }
.target .done { color: #8f8; }
.canvas-wrap { position: relative; display: flex; justify-content: center; padding: 5px; overflow: hidden; height: calc(100vh - 100px); }
canvas { cursor: crosshair; max-width: 100%; max-height: 100%; object-fit: contain; }
.instructions { position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%); background: #333a; padding: 6px 14px; border-radius: 6px; font-size: 11px; color: #aaa; pointer-events: none; }
</style>
</head>
<body>

<div class="header">
  <h1>Court Corners Editor</h1>
  <button id="undoBtn" onclick="undo()">Undo</button>
  <span class="spacer"></span>
  <span class="info" id="pointCount">0 points</span>
  <button class="primary" id="saveBtn" onclick="saveAndClose()" disabled>Save Points</button>
</div>

<div class="target" id="target"></div>

<div class="canvas-wrap">
  <canvas id="canvas"></canvas>
</div>

<div class="instructions">
  No need to label anything or track which basket is which - click the 4 outer court corners in any order, then click around the center circle. Undo reverts the last click.
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const pointCountEl = document.getElementById('pointCount');
const targetEl = document.getElementById('target');
const saveBtn = document.getElementById('saveBtn');

// Data injected by Rust at generation time.
const IMAGE_DATA = '{{IMAGE_DATA}}';
const IMAGE_WIDTH = {{IMAGE_WIDTH}};
const IMAGE_HEIGHT = {{IMAGE_HEIGHT}};

const MIN_CIRCLE_POINTS = 5;
let image = null;
const corners = []; // up to 4 {x,y}
const circle = [];  // any number of {x,y}

function loadImage(dataUri) {
  return new Promise((resolve, reject) => {
    if (!dataUri || dataUri.startsWith('{{')) { reject('no data'); return; }
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = dataUri;
  });
}

async function init() {
  try { image = await loadImage(IMAGE_DATA); } catch (e) { console.warn('image not available', e); }
  canvas.width = image ? image.naturalWidth : IMAGE_WIDTH;
  canvas.height = image ? image.naturalHeight : IMAGE_HEIGHT;
  redraw();
}

function phase() {
  return corners.length < 4 ? 'corners' : 'circle';
}

function updateTarget() {
  if (phase() === 'corners') {
    targetEl.textContent = `Click court corner ${corners.length + 1} of 4 (any corner, any order)`;
    saveBtn.disabled = true;
  } else {
    const n = circle.length;
    const enough = n >= MIN_CIRCLE_POINTS;
    targetEl.innerHTML = enough
      ? `<span class="done">${n} center-circle points clicked - click more for accuracy, or "Save Points" when done.</span>`
      : `Click a point on the center circle (${n} so far, need at least ${MIN_CIRCLE_POINTS})`;
    saveBtn.disabled = !enough;
  }
}

function redraw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (image) {
    ctx.drawImage(image, 0, 0);
  } else {
    ctx.fillStyle = '#333';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#888';
    ctx.font = '20px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('No image loaded', canvas.width / 2, canvas.height / 2);
    ctx.textAlign = 'left';
  }

  const w = canvas.width;
  const h = canvas.height;

  corners.forEach((p, i) => {
    const x = p.x * w, y = p.y * h;
    ctx.beginPath();
    ctx.arc(x, y, 6, 0, Math.PI * 2);
    ctx.fillStyle = '#fb5';
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px system-ui';
    ctx.fillText(`corner ${i + 1}`, x + 9, y - 8);
  });

  circle.forEach((p) => {
    const x = p.x * w, y = p.y * h;
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#5bf';
    ctx.fill();
  });

  pointCountEl.textContent = `${corners.length} corners, ${circle.length} circle points`;
  updateTarget();
}

canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const x = Math.round(((e.clientX - rect.left) * scaleX / canvas.width) * 10000) / 10000;
  const y = Math.round(((e.clientY - rect.top) * scaleY / canvas.height) * 10000) / 10000;

  if (phase() === 'corners') {
    corners.push({ x, y });
  } else {
    circle.push({ x, y });
  }
  redraw();
});

function undo() {
  if (circle.length > 0) {
    circle.pop();
  } else if (corners.length > 0) {
    corners.pop();
  }
  redraw();
}

function saveAndClose() {
  if (circle.length < MIN_CIRCLE_POINTS) return;
  const payload = {
    width: canvas.width,
    height: canvas.height,
    corners: corners.map(p => [p.x, p.y]),
    circle: circle.map(p => [p.x, p.y]),
  };
  const json = JSON.stringify(payload, null, 2);

  try {
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'court_corners.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    pointCountEl.textContent = 'Downloaded court_corners.json - paste its path (or the raw JSON) back into the terminal.';
    pointCountEl.style.color = '#8f8';
  } catch (e) {
    showManualCopy(json);
  }
}

function showManualCopy(json) {
  const wrap = document.querySelector('.canvas-wrap');
  wrap.innerHTML = '<textarea id="pointsText" style="width:90%;height:300px;background:#222;color:#ddd;font-family:monospace;font-size:12px;padding:10px;border:1px solid #555;border-radius:6px;">' + json + '</textarea>';
  document.getElementById('pointsText').select();
  pointCountEl.textContent = 'Download failed. Select all (Ctrl+A), copy (Ctrl+C), then paste the JSON into the terminal.';
  pointCountEl.style.color = '#ff8';
}

init();
</script>
</body>
</html>
